name: Verify and deploy RepoPilot Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify content, links and accessibility essentials
        run: npm run verify

  responsive:
    name: Test real browser layouts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned browser-test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test responsive layouts and interactions
        run: npm run test:responsive
        env:
          REPOPILOT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOPILOT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repopilot-visual-evidence
          path: artifacts/screenshots/
          retention-days: 3
          if-no-files-found: warn

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages-production-${{ github.repository }}
      cancel-in-progress: false
    needs: [verify, responsive]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the allowlisted Pages site
        run: npm run build:site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the live deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: node scripts/post-deploy-smoke.mjs "${{ steps.deployment.outputs.page_url }}"
