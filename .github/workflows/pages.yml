name: Verify and deploy RepoPilot Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify content, links and accessibility essentials
        run: npm run verify

  responsive:
    name: Test real browser layouts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install locked browser-test and accessibility dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test responsive layouts and interactions
        run: npm run test:responsive
        env:
          REPOPILOT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOPILOT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repopilot-visual-evidence
          path: artifacts/screenshots/
          retention-days: 3
          if-no-files-found: warn

  policy:
    name: Verify main protection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require main to be protected before delivery
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          if (!repository || !/^[\w.-]+\/[\w.-]+$/.test(repository)) {
            throw new Error('GITHUB_REPOSITORY is missing or malformed; refusing to infer protection.');
          }
          const apiRoot = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/$/, '');
          const response = await fetch(`${apiRoot}/repos/${repository}/branches/main`, {
            headers: {
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`
            }
          });
          if (!response.ok) {
            throw new Error(`GitHub branch metadata request failed with HTTP ${response.status}; refusing production delivery because protection cannot be verified.`);
          }
          const branch = await response.json();
          if (branch.protected !== true) {
            throw new Error('GitHub reports main as unprotected. Enable an active branch protection rule or ruleset; deployment is blocked until protection is verified.');
          }
          console.log('PASS: GitHub reports main protected; delivery may proceed to the remaining checks.');
          NODE

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages-production-${{ github.repository }}
      cancel-in-progress: false
    needs: [verify, responsive, policy]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the allowlisted Pages site
        run: npm run build:site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke-test the live deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: node scripts/post-deploy-smoke.mjs "${{ steps.deployment.outputs.page_url }}"
